<!DOCTYPE html>
<html>
  <head>
    <title>Lecture 6</title>
    
  </head>
  <body>
    <h1>Complex Form Examples</h1>
    <br>
    <form>
      <fieldset>
        <label for="calendar">Select Birthday:</label>
        <input type="date" id="calendar" name="calendar">
        <br>
        
        <label for="color_pick">Pick your favorite color:</label>
        <input type="color" id="color_pick" name="color_pick">
        <br>
        
        <label for="num_sample">Pick your favorite [whole] number:</label>
        <input type="number" id="num_sample" name="num_sample" min="-5" max="10">
        <br>

        <label or="slider_num">Pick an even value from 0-10</label>
        <input type="range" id="slider_num" name="slider_num" min="0" max="10" value="0" step="2">
        <br>

        <label for="message">Write something</label>
        <br>
        <textarea name="message" id="message" rows="10" cols="30"></textarea>
        <br>
        <fieldset>
          <button type="button">Click Here</button>
          <input type="submit" value="Complete">
        </fieldset>
      </fieldset>
    </form>
  </body>
</html>
